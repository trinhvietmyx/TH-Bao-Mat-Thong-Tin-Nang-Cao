<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Thuc hanh An toan thong tin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f6f8fb;
            color: #172033;
        }
        .shell {
            max-width: 1060px;
            margin: 0 auto;
            padding: 32px 18px 56px;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 22px;
            border-bottom: 1px solid #dfe5ee;
        }
        .brand img {
            width: 210px;
            max-width: 52vw;
            height: auto;
        }
        .brand h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            text-align: right;
        }
        .nav-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 22px 0 28px;
        }
        .nav-strip a {
            border: 1px solid #c8d2e1;
            border-radius: 6px;
            color: #172033;
            padding: 8px 12px;
            text-decoration: none;
            background: #fff;
        }
        .nav-strip a.active,
        .nav-strip a:hover {
            background: #0f5fb8;
            border-color: #0f5fb8;
            color: #fff;
        }
        .workspace {
            background: #fff;
            border: 1px solid #dde4ee;
            border-radius: 8px;
            padding: 24px;
        }
        .workspace h2 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
        }
        .section-title {
            border-top: 1px solid #e5ebf3;
            border-bottom: 1px solid #e5ebf3;
            color: #0f5fb8;
            font-weight: 700;
            margin: 22px 0 16px;
            padding: 10px 0;
            text-transform: uppercase;
        }
        .result-box {
            background: #f8fbff;
            border-left: 4px solid #0f5fb8;
            margin-top: 22px;
            padding: 16px;
        }
        .matrix {
            border-collapse: collapse;
            margin-top: 12px;
        }
        .matrix td {
            border: 1px solid #c8d2e1;
            font-weight: 700;
            height: 34px;
            text-align: center;
            width: 34px;
        }
        @media (max-width: 720px) {
            .brand {
                align-items: flex-start;
                flex-direction: column;
            }
            .brand h1 {
                text-align: left;
            }
            .workspace {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="brand">
            <a href="{{ url_for('home') }}">
                <img src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png" alt="HUTECH">
            </a>
            <h1>Bài thực hành bảo mật thông tin nâng cao</h1>
        </header>
        <nav class="nav-strip" aria-label="Cipher menu">
            <a href="{{ url_for('home') }}" class="{% if not cipher_name %}active{% endif %}">Home</a>
            {% for name, item in cipher_configs.items() %}
                <a href="{{ url_for('cipher_page', cipher_name=name) }}" class="{% if cipher_name == name %}active{% endif %}">
                    {{ item.label }}
                </a>
            {% endfor %}
        </nav>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
