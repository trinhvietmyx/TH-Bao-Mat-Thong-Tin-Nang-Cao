{% extends "base.html" %}

{% block title %}Danh mục bài thực hành{% endblock %}

{% block content %}
<section class="workspace">
    <h2>Danh mục mã hóa</h2>
    <div class="list-group">
        {% for name, item in cipher_configs.items() %}
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
               href="{{ url_for('cipher_page', cipher_name=name) }}">
                <span>{{ item.title }}</span>
                <span class="text-primary">Open</span>
            </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
